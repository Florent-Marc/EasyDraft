[package]
name = "easydraft"
version = "0.1.0"
edition = "2024"
description = "Editeur Rust de plans de maison et d'electricite en 2D"

[dependencies]
eframe = "0.33.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dialogues natifs Windows / macOS ; portail XDG sous Linux.
rfd = "=0.15.4"
# Decode les fonds de plan PNG/JPG/BMP en textures egui.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
